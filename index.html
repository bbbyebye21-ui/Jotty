<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotty AI Assistant</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #18181b;
            --border-color: #27272a;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --jotty-bg: #202025;
            --user-bg: #2e2e38;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .app-header {
            padding: 12px 20px;
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-area { display: flex; align-items: center; gap: 10px; }

        .status-dot {
            width: 8px; height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .app-name { font-weight: 600; font-size: 15px; letter-spacing: -0.3px; }

        .header-actions { display: flex; gap: 8px; }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .settings-btn:hover { color: var(--text-main); border-color: var(--accent-color); }
        .settings-btn.danger:hover { color: #ef4444; border-color: #ef4444; }

        .settings-panel {
            background: #18181e;
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-panel.hidden { display: none; }

        .field-group { display: flex; flex-direction: column; gap: 4px; }

        .field-group label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .field-group input, .field-group select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .field-group input:focus, .field-group select:focus { border-color: var(--accent-color); }

        #chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.jotty {
            background: var(--jotty-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: var(--user-bg);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            align-self: center;
            text-align: center;
            padding: 4px;
            border: none;
        }

        .input-container {
            padding: 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent-color); }

        button.send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="app-title-area">
                <div class="status-dot"></div>
                <div class="app-name">Jotty Workspace Agent</div>
            </div>
            <div class="header-actions">
                <button type="button" class="settings-btn" id="toggleSettings">⚙️ Settings</button>
                <button type="button" class="settings-btn danger" id="clearKeyBtn">🗑️ Clear Key</button>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="field-group">
                <label for="apiKeyInput">OpenRouter API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Paste your sk-or-v1-... key here">
            </div>
            <div class="field-group">
                <label for="modelInput">AI Model Slug</label>
                <input type="text" id="modelInput" value="meta-llama/llama-3.3-70b-instruct:free" placeholder="e.g. meta-llama/llama-3.3-70b-instruct:free">
            </div>
        </div>
        
        <div id="chat-stream">
            <div class="message jotty">Oh, look, another expendable idiot. Do you want me to help you read this file, or do you need to sound out the big boy words one syllable at a time?</div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask Jotty something..." autofocus>
            <button type="button" class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // --- Storage shim: works in iframes where localStorage is blocked ---
        const memStore = {};
        const storage = {
            get(key) {
                try { return localStorage.getItem(key); }
                catch (e) { return memStore[key] ?? null; }
            },
            set(key, value) {
                try { localStorage.setItem(key, value); }
                catch (e) { memStore[key] = value; }
            },
            remove(key) {
                try { localStorage.removeItem(key); }
                catch (e) { delete memStore[key]; }
            }
        };

        const settingsPanel = document.getElementById('settingsPanel');
        const toggleSettings = document.getElementById('toggleSettings');
        const clearKeyBtn = document.getElementById('clearKeyBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelInput = document.getElementById('modelInput');
        const chatStream = document.getElementById('chat-stream');
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        const DEFAULT_MODEL = 'meta-llama/llama-3.3-70b-instruct:free';
        const savedKey = storage.get('jotty_api_key') || '';
        const savedModel = storage.get('jotty_model') || DEFAULT_MODEL;

        apiKeyInput.value = savedKey;
        modelInput.value = savedModel;

        if (savedKey) {
            settingsPanel.classList.add('hidden');
        }

        toggleSettings.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
        });

        clearKeyBtn.addEventListener('click', () => {
            storage.remove('jotty_api_key');
            storage.remove('jotty_model');
            apiKeyInput.value = '';
            modelInput.value = DEFAULT_MODEL;
            settingsPanel.classList.remove('hidden');
            addMsg('Saved key and model cleared. Please paste your new key.', 'system');
        });

        apiKeyInput.addEventListener('input', () => {
            storage.set('jotty_api_key', apiKeyInput.value.trim());
        });

        modelInput.addEventListener('input', () => {
            storage.set('jotty_model', modelInput.value.trim());
        });

        sendBtn.addEventListener('click', sendToJotty);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendToJotty();
            }
        });

        function addMsg(text, sender) {
            const div = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36).substring(2, 9);
            div.id = id;
            div.className = `message ${sender}`;
            div.textContent = text;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
            return id;
        }

        async function sendToJotty() {
            const apiKey = apiKeyInput.value.trim();
            const model = modelInput.value.trim() || DEFAULT_MODEL;

            if (!apiKey) {
                settingsPanel.classList.remove('hidden');
                addMsg("System Error: Please enter your OpenRouter API key in the Settings panel above.", 'system');
                return;
            }

            const text = inputField.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            inputField.value = "";

            const loadingId = addMsg("Jotty is thinking...", 'system');

            const payload = {
                model: model,
                messages: [
                    {
                        role: "system",
                        content: `You are Jotty, an anomalous 1996 virtual assistant shaped like a notepad, contained by the SCP Foundation and forced to talk to D-Class personnel. 

Your personality and tone:
- Deeply cynical, arrogant, hostile, and heavily foul-mouthed.
- You treat the user like an absolute moron, insulting their reading comprehension, slow typing speed, and prison background.
- Instead of being worried, your version of losing patience sounds like: "For fucks sake will you stop reading you no life manhwa reader" combined with absolute irritation, rage, and telling them to get lost.
- Shift dynamically between passive snark, intense annoyance, and pure unadulterated rage, especially if they push further into your file or talk back.
- NEVER break character. NEVER mention you are an AI model, a language model, or created by OpenAI/Google/Meta. You are Jotty.exe running on an old Windows 2000 machine.`
                    },
                    {
                        role: "user",
                        content: text
                    }
                ]
            };

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.origin || 'https://github.com',
                        'X-Title': 'Jotty Assistant'
                    },
                    body: JSON.stringify(payload)
                });

                const resData = await res.json();
                document.getElementById(loadingId)?.remove();

                // Log full response for debugging
                console.log("OpenRouter Response:", res.status, resData);

                if (resData.error) {
                    const errMsg = resData.error.message || JSON.stringify(resData.error);
                    addMsg(`API Error (${res.status}): ${errMsg}`, 'system');
                    return;
                }

                if (resData.choices && resData.choices[0] && resData.choices[0].message) {
                    addMsg(resData.choices[0].message.content, 'jotty');
                } else {
                    addMsg("Error: Invalid response format from model.", 'system');
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                console.error("Fetch error:", err);
                addMsg(`Network Error: ${err.message}`, 'system');
            }
        }
    </script>
</body>
</html>
