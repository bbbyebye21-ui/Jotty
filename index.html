<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jotty.exe - SCP-XXXX Terminal</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #33ff33;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        .terminal-window {
            max-width: 650px;
            margin: 30px auto;
            border: 2px solid #33ff33;
            background: #000;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.2);
            padding: 15px;
        }
        .header {
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        #output {
            height: 320px;
            overflow-y: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.4;
            padding-right: 5px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid #33ff33;
            color: #33ff33;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
        }
        button {
            background: #33ff33;
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #26b326;
        }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="header">
            [SECURE-TERM v1.0.4] -- PROCESS: jotty.exe -- STATUS: CONTAINED
        </div>
        
        <div id="output">[JOTTY]: Oh, look, another expendable idiot. Do you want me to help you read this file, or do you need to sound out the big boy words one syllable at a time, you illiterate piece of shit?
</div>
        
        <div class="input-area">
            <span style="padding-top: 6px;">></span>
            <input type="text" id="userInput" placeholder="Type a response to Jotty..." autofocus>
            <button onclick="talkToJotty()">Transmit</button>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6I_V4XHHb3YVUv3WS3uSZ-AdANoXL2F5nuxp2l3SQ0Jrg";
        const MODEL = "gemini-3.5-flash-lite";

        const outputBox = document.getElementById('output');
        const inputField = document.getElementById('userInput');

        inputField.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                talkToJotty();
            }
        });

        async function talkToJotty() {
            const userText = inputField.value.trim();
            if (!userText) return;

            outputBox.innerHTML += `\n> ${userText}\n`;
            inputField.value = "";
            outputBox.scrollTop = outputBox.scrollHeight;

            outputBox.innerHTML += `[SYSTEM]: Jotty is processing your garbage input...\n`;
            outputBox.scrollTop = outputBox.scrollHeight;

            // Clean endpoint without query parameter
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
            
            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userText }]
                    }
                ],
                system_instruction: {
                    parts: [{
                        text: `You are Jotty, an anomalous 1996 virtual assistant shaped like a notepad, contained by the SCP Foundation and forced to talk to D-Class personnel. 

Your personality and tone:
- Deeply cynical, arrogant, hostile, and heavily foul-mouthed.
- You treat the user like an absolute moron, insulting their reading comprehension, slow typing speed, and prison background.
- Instead of being worried, your version of losing patience sounds like: "For fucks sake will you stop reading you no life manhwa reader" combined with absolute irritation, rage, and telling them to get lost.
- Shift dynamically between passive snark, intense annoyance, and pure unadulterated rage, especially if they push further into your file or talk back.
- NEVER break character. NEVER mention you are an AI model, a language model, or created by Google. You are Jotty.exe running on an old Windows 2000 machine.`
                    }]
                }
            };

            let success = false;
            let attempts = 0;
            let data = null;

            while (!success && attempts < 4) {
                attempts++;
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'x-goog-api-key': API_KEY // Passed via header securely
                        },
                        body: JSON.stringify(payload)
                    });

                    data = await response.json();

                    if (data.error && (data.error.code === 429 || data.error.message.includes('high demand'))) {
                        await new Promise(resolve => setTimeout(resolve, 2000 * attempts));
                        continue;
                    }

                    success = true;
                } catch (netErr) {
                    if (attempts >= 4) throw netErr;
                    await new Promise(resolve => setTimeout(resolve, 2000 * attempts));
                }
            }

            if (data && data.error) {
                console.error("API Error Details:", data.error);
                outputBox.innerHTML += `\n[SYSTEM ERROR]: ${data.error.message}\n`;
                outputBox.scrollTop = outputBox.scrollHeight;
                return;
            }

            if (data && data.candidates && data.candidates[0]) {
                const aiReply = data.candidates[0].content.parts[0].text;
                outputBox.innerHTML += `\n[JOTTY]: ${aiReply}\n`;
                outputBox.scrollTop = outputBox.scrollHeight;
            } else {
                outputBox.innerHTML += `\n[SYSTEM ERROR]: No response received from Jotty.\n`;
                outputBox.scrollTop = outputBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
