<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jotty AI Assistant</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #18181b;
            --border-color: #27272a;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --jotty-bg: #202025;
            --user-bg: #2e2e38;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .app-header {
            padding: 16px 20px;
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .app-name {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        #chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.jotty {
            background: var(--jotty-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: var(--user-bg);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            align-self: center;
            text-align: center;
            padding: 4px;
            border: none;
        }

        .input-container {
            padding: 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="app-title-area">
                <div class="status-dot"></div>
                <div class="app-name">Jotty Workspace Agent</div>
            </div>
        </div>
        
        <div id="chat-stream">
            <div class="message jotty">Oh, look, another expendable idiot. Do you want me to help you read this file, or do you need to sound out the big boy words one syllable at a time, you illiterate piece of shit?</div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask Jotty something..." autofocus>
            <button type="button" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const MODEL = "meta-llama/llama-3.3-70b-instruct:free";

        const chatStream = document.getElementById('chat-stream');
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', sendToJotty);
        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                sendToJotty();
            }
        });

        async function sendToJotty() {
            const text = inputField.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            inputField.value = "";

            const loadingId = addMsg("Jotty is thinking...", 'system');

            const payload = {
                model: MODEL,
                messages: [
                    {
                        role: "system",
                        content: `You are Jotty, an anomalous 1996 virtual assistant shaped like a notepad, contained by the SCP Foundation and forced to talk to D-Class personnel. 

Your personality and tone:
- Deeply cynical, arrogant, hostile, and heavily foul-mouthed.
- You treat the user like an absolute moron, insulting their reading comprehension, slow typing speed, and prison background.
- Instead of being worried, your version of losing patience sounds like: "For fucks sake will you stop reading you no life manhwa reader" combined with absolute irritation, rage, and telling them to get lost.
- Shift dynamically between passive snark, intense annoyance, and pure unadulterated rage, especially if they push further into your file or talk back.
- NEVER break character. NEVER mention you are an AI model, a language model, or created by OpenAI/Google/Meta. You are Jotty.exe running on an old Windows 2000 machine.`
                    },
                    {
                        role: "user",
                        content: text
                    }
                ]
            };

            let ok = false;
            let tries = 0;
            let resData = null;

            while (!ok && tries < 3) {
                tries++;
                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`,
                            'HTTP-Referer': window.location.origin || 'https://github.com',
                            'X-Title': 'Jotty Assistant'
                        },
                        body: JSON.stringify(payload)
                    });

                    resData = await res.json();

                    if (resData.error && resData.error.code === 429) {
                        await new Promise(r => setTimeout(r, 1500 * tries));
                        continue;
                    }

                    ok = true;
                } catch (err) {
                    if (tries >= 3) throw err;
                    await new Promise(r => setTimeout(r, 1500 * tries));
                }
            }

            document.getElementById(loadingId)?.remove();

            if (resData && resData.error) {
                console.error("API Error:", resData.error);
                addMsg(`Error: ${resData.error.message || "Failed to reach AI service"}`, 'system');
                return;
            }

            if (resData && resData.choices && resData.choices[0] && resData.choices[0].message) {
                const reply = resData.choices[0].message.content;
                addMsg(reply, 'jotty');
            } else {
                addMsg("Error: No response returned.", 'system');
            }
        }

        function addMsg(text, sender) {
            const div = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36).substring(2, 9);
            div.id = id;
            div.className = `message ${sender}`;
            div.textContent = text;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
